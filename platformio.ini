; Smart Nursery Firmware — ESP32-S3 N16R8 (Flash 16MB, PSRAM 8MB OPI)
;
; Build & upload firmware : pio run -t upload
; Upload dashboard (data/) : pio run -t uploadfs
; Serial monitor           : pio device monitor

[env:esp32-s3-n16r8]
platform = espressif32 @ 7.0.1
board = esp32-s3-devkitc-1
framework = arduino

; --- Memori: Flash 16MB QIO + PSRAM 8MB OPI ---
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

upload_port = COM8
monitor_port = COM8

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    ; Web server async dijalankan di Core 1, terpisah dari WiFi stack & TLS
    ; (CloudSyncTask) yang berjalan di Core 0.
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=1
    ; Ganti ke 1 jika serial monitor memakai port USB native (bukan port UART).
    -DARDUINO_USB_CDC_ON_BOOT=0

lib_deps =
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    claws/BH1750 @ ^1.3.0
    adafruit/RTClib @ ^2.1.4
    bblanchon/ArduinoJson @ ^7.2.1
    esp32async/AsyncTCP @ ^3.3.2
    esp32async/ESPAsyncWebServer @ ^3.6.0
